<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaMate 登录</title>
    <link rel="icon" type="image/svg+xml" href="/assets/linguamate-icon.svg">
    <link rel="stylesheet" href="/css/app.css?v=auth-split-2">
</head>
<body class="auth-page">
<canvas id="ambientCanvas" class="ambient-canvas auth-ambient-canvas" aria-hidden="true"></canvas>
<main class="auth-shell">
    <section class="auth-brand-panel">
        <div class="brand auth-brand">
            <img class="brand-mark" src="/assets/linguamate-icon.svg" alt="LinguaMate 图标">
            <div>
                <strong>LinguaMate</strong>
                <span>英语学习助手</span>
            </div>
        </div>
        <div class="auth-path" aria-hidden="true">
            <span class="node-green">Speak</span>
            <span class="node-blue">Words</span>
            <span class="node-amber">Review</span>
            <span class="node-coral">Writing</span>
        </div>
        <div>
            <p class="eyebrow">学习端 / 管理端</p>
            <h1 id="authHeroTitle">先登录，再开始今天的英语路线</h1>
            <p id="authHeroSubtitle" class="subtitle">学习记录会绑定到你的账号，管理员账号会进入独立后台。</p>
        </div>
        <div class="auth-demo">
            <span>演示账号</span>
            <strong>student / student123</strong>
            <strong>admin / admin123</strong>
        </div>
    </section>

    <section class="auth-card">
        <nav class="auth-mode-row" aria-label="登录注册切换">
            <a id="loginModePill" class="auth-mode-pill" href="/login">登录</a>
            <a id="registerModePill" class="auth-mode-pill" href="/register">注册</a>
        </nav>

        <form id="loginForm" class="auth-form">
            <label class="settings-field">
                <span>用户名</span>
                <input id="loginUsername" autocomplete="username" value="student">
            </label>
            <label class="settings-field">
                <span>密码</span>
                <input id="loginPassword" type="password" autocomplete="current-password" value="student123">
            </label>
            <button class="auth-primary" type="submit">进入学习</button>
            <p class="auth-switch-copy">还没有账号？<a href="/register">点击注册</a></p>
        </form>

        <form id="registerForm" class="auth-form" hidden>
            <label class="settings-field">
                <span>用户名</span>
                <input id="registerUsername" autocomplete="username" placeholder="3-32 位">
            </label>
            <label class="settings-field">
                <span>昵称</span>
                <input id="registerNickname" autocomplete="nickname" placeholder="显示在主页">
            </label>
            <label class="settings-field">
                <span>密码</span>
                <input id="registerPassword" type="password" autocomplete="new-password" placeholder="至少 6 位">
            </label>
            <button class="auth-primary" type="submit">创建账号</button>
            <p class="auth-switch-copy">已有账号？<a href="/login">点击登录</a></p>
        </form>
        <p id="authStatus" class="settings-status auth-status"></p>
    </section>
</main>
<script src="/js/auth-ambient.js?v=auth-bubbles-1"></script>
<script src="/js/auth.js?v=auth-split-2"></script>
</body>
</html>
