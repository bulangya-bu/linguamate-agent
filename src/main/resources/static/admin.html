<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaMate 管理端</title>
    <link rel="icon" type="image/svg+xml" href="/assets/linguamate-icon.svg">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-page">
<div class="app-shell admin-shell">
    <aside class="side-nav" aria-label="管理导航">
        <div class="brand">
            <img class="brand-mark" src="/assets/linguamate-icon.svg" alt="LinguaMate 图标">
            <div>
                <strong>LinguaMate</strong>
                <span>管理工作台</span>
            </div>
        </div>
        <nav>
            <button class="nav-item active" data-admin-section="overview"><span class="nav-dot"></span>概览</button>
            <button class="nav-item" data-admin-section="users"><span class="nav-dot"></span>用户</button>
            <button class="nav-item" data-admin-section="words"><span class="nav-dot"></span>词库</button>
            <button class="nav-item" data-admin-section="knowledge"><span class="nav-dot"></span>知识库</button>
            <button class="nav-item" data-admin-section="news"><span class="nav-dot"></span>阅读</button>
            <button class="nav-item" data-admin-section="ai"><span class="nav-dot"></span>AI 设置</button>
        </nav>
        <div class="nav-account">
            <div class="user-chip">
                <span id="adminUserName">管理员</span>
                <small>ADMIN</small>
            </div>
            <a class="nav-link-button" href="/">用户端</a>
            <button id="adminLogoutBtn" class="nav-link-button danger" type="button">退出</button>
        </div>
    </aside>

    <main class="workspace">
        <header class="topbar admin-topbar">
            <div>
                <p class="eyebrow">管理端</p>
                <h1>用户、词库与阅读内容工作台</h1>
                <p class="subtitle">只允许管理员账号访问，集中查看用户学习数据并维护单词、阅读文章和知识库。</p>
            </div>
        </header>

        <section id="overview" class="section active">
            <div id="adminSummaryGrid" class="admin-summary-grid"></div>
        </section>

        <section id="users" class="section">
            <div class="admin-two-column">
                <section class="panel">
                    <div class="panel-heading">
                        <h2>用户管理</h2>
                        <input id="userSearch" class="admin-search" placeholder="搜索用户名或昵称">
                    </div>
                    <div id="userTable" class="admin-table"></div>
                </section>
                <section class="panel admin-profile-panel">
                    <h2>用户数据详情</h2>
                    <div id="userProfilePanel" class="admin-profile empty-state">选择一个用户查看学习数据汇总。</div>
                </section>
            </div>
        </section>

        <section id="words" class="section">
            <div class="admin-two-column">
                <section class="panel">
                    <div class="panel-heading">
                        <h2>词库维护</h2>
                        <input id="wordSearch" class="admin-search" placeholder="搜索英文或中文">
                    </div>
                    <div id="wordTable" class="admin-table"></div>
                </section>
                <section class="panel">
                    <h2>新增/编辑单词</h2>
                    <form id="wordForm" class="admin-form">
                        <input id="wordId" type="hidden">
                        <input id="wordText" placeholder="word">
                        <input id="wordMeaning" placeholder="中文释义">
                        <input id="wordPart" placeholder="词性">
                        <input id="wordTag" placeholder="分类，如 cet4-bank">
                        <input id="wordPhoneticUs" placeholder="美式音标">
                        <input id="wordPhoneticUk" placeholder="英式音标">
                        <textarea id="wordExampleEn" placeholder="英文例句"></textarea>
                        <textarea id="wordExampleCn" placeholder="中文例句"></textarea>
                        <div class="settings-row">
                            <button class="settings-primary" type="submit">保存单词</button>
                            <button id="clearWordFormBtn" class="settings-secondary" type="button">清空</button>
                        </div>
                    </form>
                </section>
            </div>
        </section>

        <section id="knowledge" class="section">
            <div class="admin-two-column">
                <section class="panel">
                    <h2>知识库文档</h2>
                    <div id="knowledgeList" class="admin-table"></div>
                </section>
                <section class="panel">
                    <h2>导入知识</h2>
                    <form id="knowledgeForm" class="admin-form">
                        <input id="knowledgeTitle" placeholder="标题">
                        <input id="knowledgeSourceType" placeholder="类型，如 grammar / rubric">
                        <input id="knowledgeTags" placeholder="标签，逗号分隔">
                        <textarea id="knowledgeContent" placeholder="知识内容"></textarea>
                        <button class="settings-primary" type="submit">导入并切分</button>
                    </form>
                </section>
            </div>
        </section>

        <section id="news" class="section">
            <div class="admin-two-column">
                <section class="panel">
                    <div class="panel-heading">
                        <h2>阅读文章</h2>
                        <input id="newsSearch" class="admin-search" placeholder="搜索标题、来源或标签">
                    </div>
                    <div id="newsTable" class="admin-table"></div>
                </section>
                <section class="panel">
                    <h2>新增/编辑阅读</h2>
                    <form id="newsForm" class="admin-form">
                        <input id="newsId" type="hidden">
                        <input id="newsTitle" placeholder="文章标题">
                        <input id="newsSource" placeholder="来源">
                        <input id="newsDifficulty" placeholder="难度，如 easy / medium / hard">
                        <input id="newsTags" placeholder="标签，逗号分隔">
                        <textarea id="newsSummary" placeholder="摘要"></textarea>
                        <textarea id="newsContent" class="admin-tall-textarea" placeholder="正文内容"></textarea>
                        <div class="settings-row">
                            <button class="settings-primary" type="submit">保存阅读</button>
                            <button id="clearNewsFormBtn" class="settings-secondary" type="button">清空</button>
                        </div>
                    </form>
                </section>
            </div>
        </section>

        <section id="ai" class="section">
            <section class="panel admin-ai-panel">
                <div class="settings-panel-head">
                    <div>
                        <p class="eyebrow compact">AI 设置</p>
                        <h2>模型连接</h2>
                    </div>
                    <span id="aiConnectionStatus" class="settings-status">未连接</span>
                </div>
                <div class="settings-form">
                    <label class="settings-field" for="aiBaseUrl">
                        <span>模型地址</span>
                        <input id="aiBaseUrl" autocomplete="off" placeholder="https://api.openai.com/v1">
                    </label>
                    <label class="settings-field" for="aiApiKey">
                        <span>API 密钥</span>
                        <input id="aiApiKey" type="password" autocomplete="off" placeholder="留空则沿用已保存密钥">
                    </label>
                    <div class="settings-row">
                        <button id="fetchModelsBtn" class="settings-secondary" type="button">获取模型</button>
                        <label class="settings-field admin-model-select" for="aiModelSelect">
                            <span>模型名</span>
                            <select id="aiModelSelect" disabled></select>
                        </label>
                    </div>
                    <div class="settings-actions">
                        <button id="saveAiSettingsBtn" class="settings-primary" type="button">保存并应用</button>
                    </div>
                </div>
            </section>
        </section>
    </main>
</div>
<script src="/js/admin.js"></script>
</body>
</html>
