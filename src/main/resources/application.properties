spring.application.name=linguamate-agent

server.port=${SERVER_PORT:4040}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

spring.web.resources.add-mappings=false
linguamate.web.allowed-origins=${LINGUAMATE_WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-components=always

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/linguamate?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.pool-name=LinguaMateHikariPool
spring.sql.init.mode=${DB_INIT_MODE:always}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.repositories.enabled=false
linguamate.cache.redis.enabled=${LINGUAMATE_REDIS_CACHE_ENABLED:true}

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false

linguamate.ai.provider=openai-compatible
linguamate.ai.base-url=${LINGUAMATE_AI_BASE_URL:https://api.openai.com/v1}
linguamate.ai.api-key=${LINGUAMATE_AI_API_KEY:}
linguamate.ai.chat-model=${LINGUAMATE_AI_CHAT_MODEL:gpt-4o-mini}
linguamate.ai.embedding-model=${LINGUAMATE_AI_EMBEDDING_MODEL:text-embedding-3-small}
